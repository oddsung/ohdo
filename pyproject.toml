[project]
name = "ohdo"
version = "0.1.0"
description = "AI(Gemini CLI)와 대화하면서 Windows 데스크톱/웹 자동화 코드를 단계별로 생성·실행하는 PySide6 기반 RPA 솔루션."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "oddsung", email = "oddsung@gmail.com" },
]
keywords = ["rpa", "automation", "ai", "gemini", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Office/Business",
]

dependencies = [
    # UI Framework — 5/12 PySide6 (LGPL) 메인 전환 완료.
    # PyQt6 (GPL/Riverbank commercial) 는 legacy_pyqt6/ 에 deprecated 코드로 보존,
    # 의존성은 optional extra [legacy-pyqt6] 로 격리 (아래 [project.optional-dependencies]).
    "PySide6>=6.5.0",
    # Screen Capture & Image Processing
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    # OCR
    "pytesseract>=0.3.10",
    # Desktop Automation (Windows 전용 의존성은 platform marker 로 분기)
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    # Web Automation
    "selenium>=4.15.0",
    # Data Processing
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # Network
    "requests>=2.31.0",
    # Scheduling
    "APScheduler>=3.10.0",
    # CLI & Logging
    "rich>=13.0.0",
    # Data Validation + Settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Environment Config
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 개발 도구 — Phase 0 sub-phase 2 (pre-commit + ruff)
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
]
# 테스트 도구 — 현재 자체 test_runner 사용 (pytest 미사용). 미래 pytest 도입 시 채움
test = []
# 5/12 PySide6 메인 전환 후 PyQt6 deprecated 코드 (legacy_pyqt6/) 실행용.
# `uv sync --extra legacy-pyqt6` 로만 설치. 기본 sync 에는 포함 안 됨.
legacy-pyqt6 = [
    "PyQt6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/oddsung/ohdo"
Repository = "https://github.com/oddsung/ohdo"
Issues = "https://github.com/oddsung/ohdo/issues"
Documentation = "https://github.com/oddsung/ohdo/tree/main/docs"

# uv 가 ohdo 를 wheel/source dist 로 패키징하지 않게 함 — ohdo 는 데스크톱 앱이라
# `python main.py` 직접 실행이지 pip install 로 설치되는 라이브러리가 아님.
# `core/` 가 별도 패키지로 분리되는 시점 (Phase 1 말 ~ Phase 2 시작, ROADMAP §7.3) 에
# 본격 packaging 을 활성화. 그 전엔 의존성 관리만 uv 활용.
[tool.uv]
package = false

# ─────────────────────────────────────────────────────────
# ruff — lint + format (black 대체)
# ─────────────────────────────────────────────────────────
# Phase 0 sub-phase 2 — 보수적 ruleset 으로 시작:
#   E,F  : pyflakes + pycodestyle 기본 (구문/import 오류)
#   W    : 경고 (whitespace 등)
#   I    : isort (import 정렬)
# 추가 ruleset (예: B/UP/SIM) 은 Phase 1 의 type hint 도입 시점에 점진 추가.
# 30K 라인 legacy 코드에 너무 엄격하게 켜면 수천 위반 → 도구 효과 X.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "ohdo_20260505_backup",
    "tests/results",
    "tmp",
    "data",
    "venv",
    ".venv",
    "packages",
    # 5/12 Plan 1 — PyQt6 deprecated 코드 (보관만, lint 의무 없음).
    "legacy_pyqt6",
    # 루트 레벨 임시 진단 스크립트 (CI 대상 X)
    "test_click_diagnosis.py",
    "uia_test.py",
    "encoding_test.py",
    "sandbox_test.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line too long) 은 ruff format 이 자동 처리하므로 lint 단계에선 제외.
# F401 (unused import) 은 __init__.py 의 re-export 패턴 false positive 회피용 module-level ignore.
ignore = ["E501"]

# 5/12 Plan 1 swap — ruff 의 source-layout 자동 추론은 root 의 `ui/__init__.py`
# 같은 패키지 마커에 의존. swap 중간 상태에서 일시적으로 깨질 수 있으므로 명시.
[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "ui",
    "ui_v2",
    "tests",
    "actions",
    "agent",
    "recognition",
    "scripts",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# tests 와 ui/main_window.py 는 sys.path.insert(0, PROJECT_ROOT) 패턴 후 import 가
# 필수 — E402 false positive.
"tests/*" = ["E402"]
"ui/main_window.py" = ["E402"]
# element_picker 의 pywinauto/Desktop import 는 _pywinauto_available 플래그용 —
# 직접 참조는 안 되지만 try/except 안에서 import 자체가 availability check 역할.
"ui/element_picker.py" = ["F401"]
# agent/ws_client 의 try-except import 도 같은 패턴 (선택적 의존성).
"agent/ws_client.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
