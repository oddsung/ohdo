# Phase 0 sub-phase 4 (5/8) — GitHub Actions CI 매트릭스.
# 5/12 — PySide6 (LGPL) 메인 전환 반영 (handoff §20).
#
# 트리거: push / PR (모든 브랜치). main 머지 전 회귀 가드.
#
# 작업:
#   lint         (ubuntu)  — ruff check + format check (빠른 피드백)
#   test-ubuntu            — core + scenarios 실행 (cross-platform 회귀 검증)
#   test-windows           — core + scenarios 실행 (pywinauto/pyautogui 의존성 검증)
#
# 보류:
#   - ai_integration suite — Gemini CLI 셋업 + API key secret 필요. 로컬 수동 유지.
#   - GUI 자동화 suite (notepad/calculator/browser) — Windows GUI 환경 필수.
#   - legacy_pyqt6/ — deprecated, lint 대상 외 (pyproject.toml `extend-exclude`).
#     실행 검증 필요 시 `uv sync --extra legacy-pyqt6`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test-ubuntu:
    name: Test (Ubuntu — core + scenarios)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # PySide6 wheel 은 Qt binaries 포함하지만 platform plugin 은 X server 가 없으면
      # 실패 → headless CI 에선 offscreen 사용. tests/test_core.py 는 module import
      # 만 하지만 일부 scenarios 가 ui_v2 클래스 import → Qt 모듈 로드.
      QT_QPA_PLATFORM: offscreen
      # headless Linux 엔 SecretService(DBus) 가 없어 vault 계열 테스트가
      # NoKeyringError — CI 한정 plaintext 백엔드로 vault 로직 자체를 검증
      # (실사용 백엔드는 OS keyring — Windows 잡이 실경로 커버).
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 시스템 의존성 + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (no Windows-only — sys_platform marker)
        run: |
          uv sync
          uv pip install keyrings.alt

      # xvfb-run: pyautogui→mouseinfo 가 import 시점에 X DISPLAY 를 요구
      # (KeyError: DISPLAY 로 테스트 즉사) → 가상 디스플레이로 감싼다.
      - name: Run core suite
        run: xvfb-run -a uv run python -m tests.test_runner --suite core

      - name: Run scenarios suite
        run: xvfb-run -a uv run python -m tests.test_runner --suite scenarios

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu
          path: tests/results/*.json
          retention-days: 14

  test-windows:
    name: Test (Windows — core + scenarios + pywinauto)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run core suite
        run: uv run python -m tests.test_runner --suite core

      - name: Run scenarios suite
        run: uv run python -m tests.test_runner --suite scenarios

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: tests/results/*.json
          retention-days: 14
