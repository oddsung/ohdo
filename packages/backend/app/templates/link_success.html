<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ohdo 기기 연결 완료</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #0b0c0f;
            --panel: #15171c;
            --text: #e6e7ea;
            --muted: #8a8f99;
            --accent: #5b8cff;
            --success: #4caf7d;
            --border: #262932;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f7f9;
                --panel: #ffffff;
                --text: #1a1c20;
                --muted: #606672;
                --accent: #2553e8;
                --success: #2e8b57;
                --border: #e1e4ea;
            }
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main {
            max-width: 420px;
            padding: 32px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            margin: 16px;
        }
        .check {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            margin: 8px 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        strong { color: var(--text); }
    </style>
</head>
<body>
    <main>
        <div class="check">&#10003;</div>
        <h1>기기가 연결되었습니다</h1>
        <p><strong>{{ agent_name }}</strong> 이(가) <strong>{{ email }}</strong> 계정에 연결되었습니다.</p>
        <p>이 창을 닫고 Agent 로 돌아가세요.</p>
    </main>
</body>
</html>
