<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ohdo 기기 연결</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #0b0c0f;
            --panel: #15171c;
            --text: #e6e7ea;
            --muted: #8a8f99;
            --accent: #5b8cff;
            --accent-hover: #7aa1ff;
            --danger: #ff7575;
            --border: #262932;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f7f9;
                --panel: #ffffff;
                --text: #1a1c20;
                --muted: #606672;
                --accent: #2553e8;
                --accent-hover: #1a3fb8;
                --danger: #c0392b;
                --border: #e1e4ea;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 16px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
        }
        p.lead {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin: 16px 0 6px;
            color: var(--muted);
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }
        input[type="text"]#user_code {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            letter-spacing: 2px;
            text-align: center;
            font-size: 18px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 120ms;
        }
        button:hover { background: var(--accent-hover); }
        .error {
            margin-top: 16px;
            padding: 10px 12px;
            background: rgba(255, 117, 117, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            font-size: 13px;
        }
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <h1>ohdo 기기 연결</h1>
        <p class="lead">Agent 화면에 표시된 코드를 입력하고, 이 기기를 연결할 이메일을 적어주세요.</p>

        <form method="post" action="/link/approve">
            <label for="user_code">기기 코드</label>
            <input
                type="text"
                id="user_code"
                name="user_code"
                value="{{ prefilled_code }}"
                placeholder="ABCD-EFGH"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                required>

            <label for="email">이메일</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required>

            <button type="submit">연결</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="footer">
            이 페이지는 ohdo.ai 의 초기 베타 로그인 흐름입니다. 이메일 인증은 추후 추가됩니다.
        </div>
    </main>
</body>
</html>
