# Explicit nixpacks build plan.
#
# Why this file exists:
#   Previously, packages/backend/Procfile had a 'release: alembic upgrade head'
#   line which Railway's nixpacks compiled into a Docker build-time RUN step.
#   That runs before container start, without access to Railway's private
#   network where the Postgres service lives, so alembic got DNS
#   resolution failures. See docs/saas/architecture/03-m1.1-postgres-auth-schema.md.
#
#   Procfile has now been removed and this nixpacks.toml makes the intent
#   explicit: the build stage only installs dependencies; no alembic at build.
#   Migration runs at container start via railway.json startCommand.
#
# Reference: https://nixpacks.com/docs/configuration/file

providers = ["python"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt",
]

# Fallback start cmd — railway.json `deploy.startCommand` overrides this at
# runtime. Both do the same thing for consistency.
[start]
cmd = ". /opt/venv/bin/activate && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
