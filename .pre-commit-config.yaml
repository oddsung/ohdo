# pre-commit hooks — Phase 0 sub-phase 2 (5/7).
# 설치: `uv sync --extra dev` 후 `pre-commit install` (한 번만, .git/hooks 에 등록).
# 매뉴얼 실행: `pre-commit run --all-files` (모든 파일 검사).
#
# ruff 가 lint + format 을 모두 cover (black 대체). mypy 는 Phase 1 의
# core/* 타입힌트 도입 시점에 추가 (현 30K 라인 UI 코드에 strict mypy 시 수천 에러).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # ① 코드 lint (E/F/W/I — pyproject.toml 의 [tool.ruff.lint] 참조).
      #    auto-fix 가능한 것 (예: import 정렬, unused import) 은 자동 수정.
      - id: ruff
        args: [--fix]
      # ② 포맷 검사 (black 대체). ohdo 코드베이스 전체는 5/7 에 ruff format 일괄 적용됨.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 일반적인 위생 검사 — 줄 끝 whitespace, 파일 끝 newline 등.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]  # 1MB 초과 파일 commit 차단 (data/captures 보호)
